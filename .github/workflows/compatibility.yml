name: Host and MCP compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install toolkit and test tools
        run: python -m pip install -e ".[dev]" build
      - name: Static checks
        run: python -m ruff check src tests/test_integration_compatibility.py
      - name: Tests including native process, private storage and stdio MCP
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/browser
      - name: Build wheel and source distribution
        run: python -m build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser -q --screenshot=only-on-failure --output=browser-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-debugging
          path: browser-results
