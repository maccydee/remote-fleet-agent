name: Dependency security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pip-audit
      - run: python -m pip_audit --local --skip-editable --progress-spinner off
