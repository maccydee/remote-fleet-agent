name: Secret checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified scanner archive
        env:
          VERSION: '8.30.1'
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 "$base/gitleaks_${VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          awk -v name="$archive" '$2 == name {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
      - name: Scan complete history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --ignore-gitleaks-allow --no-banner --config .gitleaks.toml .'
